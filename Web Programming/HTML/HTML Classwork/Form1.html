<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <table>
    <form action="/dummy" method="post" >
         <h1>
          Student Registration Form
         </h1>
        <tr>
        <td> Enter Name:</td> 
        <td><input type="text"placeholder="UserName" name="name"></td>
        </tr>
       
        <tr>
        <td> Enter Password:</td>
        <td><input type="text"placeholder="Password" name="pass" ></td>
        </tr>
        
         <tr>
         <td>Enter Address:</td>
        <td><input type="text"placeholder="Address" name="address"></td>
        </tr>
       
         <tr>
         <td>Select Games:</td>
         <td>
         <input type="CheckBox" value="Hockey" name="Hockey">
         <label for="id1">Hockey</label>
        
        <input type="CheckBox" value="Football" name="Football">
        <label for="id2">Football</label>
        
        <input type="CheckBox" value="Circket" name="Circket">
        <label for="id3">Circket</label>
       
        <input type="CheckBox" value="Badmintation" name="Badmintation">
         <label for="id4">Badmintation</label>
         </td>
        </tr>

        <tr>
           <td> Gender:</td>
        <td>
        <input type="radio" value="Male" name="Gender">
        <label for="id1">Male</label>
        <input type="radio" value="Female" name="Gender">
        <label for="id2">Female</label>
        <input type="radio" value="Others" name="Gender">
         <label for="id3">Others</label>
         </td>
         </tr>
         
         <tr>
            <td>Select City:</td>
            <td>
         <select name="city" id="city">
            <option value="Delhi">Delhi</option>
             <option value="Mumbai">Mumbai</option>
              <option value="Banglore">Banglore</option>
         </select>
         </td>
         </tr>
         <tr>
        <td>Select Photo:</td>
         <td><input type="file"placeholder="Choice photo" ></td>
         </tr>
          <tr>
         <td><input type="Submit"></td>
         </tr>
    </form>
    </table>
</body>
</html>
