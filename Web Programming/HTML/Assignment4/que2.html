<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List Example</title>
</head>
<body>

    <h1>My Daily Routine</h1>

    <!-- Ordered List with type and start -->
    <ol type="1" start="1">
        <li>Wake up early</li>
        <li>Exercise</li>
        <li>Study Java</li>
        <li>Practice Coding</li>
    </ol>

    <hr>

    <h2>Technical Skills</h2>

    <!-- Ordered List with different type -->
    <ol type="A" start="3">
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <hr>

    <h2>Hobbies</h2>

    <!-- Unordered List with type -->
    <ul type="circle">
        <li>Reading</li>
        <li>Coding</li>
        <li>Listening to Music</li>
    </ul>

    <ul type="square">
        <li>Traveling</li>
        <li>Photography</li>
        <li>Blog Writing</li>
    </ul>

</body>
</html>
