<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* Hide scrollbar */
::-webkit-scrollbar{
    display:none;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
}

.app{
    width:380px;
    background:#fff;
    height:100vh;
    overflow-y:auto;
}

/* Header */
.header{
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #ddd;
}

/* Stories */
.stories{
    display:flex;
    gap:12px;
    padding:10px;
    overflow-x:auto;
    border-bottom:1px solid #ddd;
}

.story{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:75px;
}

.story img{
    width:65px;
    height:65px;
    border-radius:50%;
    border:3px solid #ff0066;
}

.story span{
    font-size:12px;
    margin-top:5px;
}

/* Feed */
.post{
    margin-bottom:20px;
}

/* Post header */
.post-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
}

.post-header img{
    width:35px;
    height:35px;
    border-radius:50%;
}

.post-header span{
    font-weight:bold;
}

/* Post image */
.post img.post-img{
    width:100%;
    height:auto;
}

/* Actions */
.post-actions{
    padding:10px;
    font-size:20px;
}

/* Caption */
.post p{
    padding:0 10px 10px;
    font-size:14px;
}
</style>
</head>

<body>
