<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
     function FindCommonElement(){
     inp1=document.getElementById("inp1").Value
     inp2=document.getElementById("inp2").Value
     arr1=inp1.split(",")
     arr2=inp1.split(",")
     arr3=[]
     k=0;
     for(i=0;i<arr1.length;i++){
        for(j=0;j<arr2.length;j++){
            if(arr1[i]==arr2[j])
            arr3[k++]=arr1[i]
        }
        console.log(arr3)
     }
     //console.log(arr3)
     }
    </script>
</head>
<body>
    <input type="text" id="inp1">
    <input type="text" id="inp2">
    <button onclick="FindCommonElement()">FindCommonElement</button>
    <span  id="res"></span>
</body>
</html>
