<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    function printTable(){

 num=parseInt(document.getElementById("inp1").value)
 str="<table>"
 for(i=1;i<=10;i++){
 res=num*i
//  str=str+num+"*"+i+"="+res+"<br>"
 str=str+`<tr><td>${num}</td><td>*</td><td>${i}</td><td>=</td><td>${res}</td></tr>`
 }
 document.getElementById("op").innerHTML = str
 }
    </script>
</head>
<body>
    Enter Number<input type="text" id="inp1">
    <br>
   <button onclick="printTable()">printTable</button>
   <br>
   <span  id="op">
   </span>
</body>
</html>
