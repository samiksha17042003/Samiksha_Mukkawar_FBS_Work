<head>

    #maincontainer{

   display:flex;

    }

    <script>
 function printTable(){
 num=parseInt(document.getElementById("inp1").value)
 str="<div id='maincontainer'>"
 for(j=num;j<num+10;j++){
 str=str+"<div><table boarder='1'>"
 for(i=1;i<=10;i++){
 res=j*i
//  str=str+num+"*"+i+"="+res+"<br>"
 str=str+`<tr><td>${j}</td><td>*</td><td>${i}</td><td>=</td><td>${res}</td></tr>`
 }

 str=str+"</table></div>"
 console.log(str)
 }
 str=str+"</div>"
 document.getElementById("op").innerHTML = str
 }
    </script>
</head>
<body>
    Enter Number<input type="text" id="inp1">
    <br>
   <button onclick="printTable()">printTable</button>
   <br>

   </span>
</body>
